<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown-light.min.css">
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
</head>

<body>
  <header class="site-header">
    <div class="nav-inner">
      <a class="brand" href="index.html" aria-label="Daily Logs home">
        <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="21.5" fill="none" stroke="#fff" stroke-width="2.5" />
          <path d="M18 24 L31 15 M18 24 L31 33" stroke="#fff" stroke-width="2.4" stroke-linecap="round" />
          <circle cx="17.5" cy="24" r="3.4" fill="#fff" />
          <circle cx="31.5" cy="15" r="3.4" fill="#fff" />
          <circle cx="31.5" cy="33" r="3.4" fill="#fff" />
        </svg>
        <span class="brand-text">
          <strong>Daily Logs</strong>
          <small>Log viewer</small>
        </span>
      </a>

      <nav class="nav-links" aria-label="Primary">
        <a href="index.html">Timeline</a>
        <a class="nav-cta" href="https://github.com/dawidpolakowski/daily-log" target="_blank" rel="noreferrer">GitHub</a>
      </nav>
    </div>
  </header>

  <main>
    <article class="reader">
      <a class="reader-back" href="index.html">&larr; Back to all logs</a>
      <div id="content" class="markdown-body">Loading…</div>
    </article>
  </main>

  <script>
    const content = document.getElementById('content');
    const params = new URLSearchParams(window.location.search);
    const file = params.get('file');

    function isSafeLogPath(path) {
      return /^[0-9]{4}-[0-9]{2}\/[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$/.test(path)
        || /^[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$/.test(path);
    }

    if (!file || !isSafeLogPath(file)) {
      content.textContent = 'No valid log file specified.';
    } else {
      fetch(`logs/${file}`)
        .then((response) => {
          if (!response.ok) {
            throw new Error(`Failed to load ${file}`);
          }

          return response.text();
        })
        .then((markdown) => {
          content.innerHTML = marked.parse(markdown);
          const heading = content.querySelector('h1');
          if (heading) document.title = `${heading.textContent} · Daily Logs`;
        })
        .catch(() => {
          content.textContent = 'Failed to load log.';
        });
    }
  </script>
</body>

</html>
