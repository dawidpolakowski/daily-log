<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link id="md-theme" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown-light.min.css">
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
  <script>
    (function () {
      function apply(t) {
        document.documentElement.dataset.theme = t;
        var md = document.getElementById('md-theme');
        if (md) md.href = 'https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown-'
          + (t === 'dark' ? 'dark' : 'light') + '.min.css';
      }
      var t = new URLSearchParams(location.search).get('theme')
        || localStorage.getItem('theme')
        || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      apply(t);
      window.__toggleTheme = function () {
        t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        localStorage.setItem('theme', t);
        apply(t);
      };
    })();
  </script>
</head>

<body>
  <header class="site-header">
    <div class="nav-inner">
      <a class="brand" href="index.html" aria-label="Daily Logs home">
        <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="21.5" fill="none" stroke="#fff" stroke-width="2.5" />
          <path d="M18 24 L31 15 M18 24 L31 33" stroke="#fff" stroke-width="2.4" stroke-linecap="round" />
          <circle cx="17.5" cy="24" r="3.4" fill="#fff" />
          <circle cx="31.5" cy="15" r="3.4" fill="#fff" />
          <circle cx="31.5" cy="33" r="3.4" fill="#fff" />
        </svg>
        <span class="brand-text">
          <strong>Daily Logs</strong>
          <small>Log viewer</small>
        </span>
      </a>

      <nav class="nav-links" aria-label="Primary">
        <a href="index.html">Timeline</a>
        <a class="nav-cta" href="https://github.com/dawidpolakowski/daily-log" target="_blank" rel="noreferrer">GitHub</a>
        <button id="theme-toggle" class="theme-toggle" type="button" onclick="__toggleTheme()" aria-label="Toggle dark mode" title="Toggle theme">
          <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M2 12h2.5M19.5 12H22M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main>
    <article class="reader">
      <a class="reader-back" href="index.html">&larr; Back to all logs</a>
      <div id="content" class="markdown-body">Loading…</div>
    </article>
  </main>

  <script>
    const content = document.getElementById('content');
    const params = new URLSearchParams(window.location.search);
    const file = params.get('file');

    function isSafeLogPath(path) {
      return /^[0-9]{4}-[0-9]{2}\/[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$/.test(path)
        || /^[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$/.test(path);
    }

    if (!file || !isSafeLogPath(file)) {
      content.textContent = 'No valid log file specified.';
    } else {
      fetch(`logs/${file}`)
        .then((response) => {
          if (!response.ok) {
            throw new Error(`Failed to load ${file}`);
          }

          return response.text();
        })
        .then((markdown) => {
          content.innerHTML = marked.parse(markdown);
          const heading = content.querySelector('h1');
          if (heading) document.title = `${heading.textContent} · Daily Logs`;
        })
        .catch(() => {
          content.textContent = 'Failed to load log.';
        });
    }
  </script>
</body>

</html>
